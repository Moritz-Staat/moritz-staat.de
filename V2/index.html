<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Moritz Staat – Web Developer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- Startseite -->
<section id="hero">
    <div class="content">
        <h1>Moritz Staat</h1>
        <p>Web Developer, Designer, Innovator</p>
        <a href="#about" class="btn">Mehr über mich</a>
    </div>
</section>

<!-- Über mich -->
<section id="about">
    <div class="container">
        <h2>Über mich</h2>
        <p>Ich bin ein Webentwickler mit einer Leidenschaft für minimalistisches Design und klare Nutzererfahrungen.</p>
    </div>
</section>

<!-- Projekte -->
<section id="projects">
    <div class="container">
        <h2>Projekte</h2>
        <div class="project-grid">
            <div class="project-item">
                <img src="../images/ImCasten (8 von 26) - Kopie.jpg" alt="Projekt 1">
                <p>Projekt 1 Beschreibung</p>
            </div>
            <!-- Weitere Projekte hinzufügen -->
        </div>
    </div>
</section>

<!-- Kontakt -->
<section id="contact">
    <div class="container">
        <h2>Kontakt</h2>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Nachricht</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Absenden</button>
        </form>
    </div>
</section>

<!-- Vollbild bei Inaktivität -->
<div id="fullscreenImage">
    <img src="../images/ImCasten (8 von 26) - Kopie.jpg" alt="Hintergrundbild">
    <div class="overlay-text">
        <h2>Moritz Staat</h2>
        <p>Creating Digital Experiences with Passion and Precision.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
